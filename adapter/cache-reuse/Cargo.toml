# Thin static-library shell around the pinned cache-reuse-utils C ABI.
# Cargo does not emit a stable staticlib path for a dependency, so this crate
# re-exports the FFI entry point and produces libds4_cache_reuse.a.
[package]
name = "ds4-cache-reuse"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "ds4_cache_reuse"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
cache-reuse-utils-ffi = { git = "https://github.com/webdesserts/cache-reuse-utils.git", rev = "0a290dce62fbcbb7c434fa60057d246934865645" }

[profile.release]
panic = "unwind"
